<!DOCTYPE html>

    .accent-gradient-text {
      background: linear-gradient(135deg, #f97316 20%, #4338ca 70%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

  <script>
    // ==============================================================

        fallbackTitle: "THE DARK SIDE OF THE MOON",
        fallbackArtist: "PINK FLOYD",

        fallbackBarcode: "724358213621",
        fallbackCover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800&q=80",
        fallbackTracks: [
          { n: "01", t: "SPEAK TO ME / BREATHE", l: "03:57" },
          { n: "02", t: "ON THE RUN", l: "03:35" },
          { n: "03", t: "TIME", l: "07:05" },

        ]
      },
      {
        mbid: "1834eae1-741b-3c03-9ca5-0df3decb43ea", // Radiohead - OK Computer
        fallbackTitle: "OK COMPUTER",
        fallbackArtist: "RADIOHEAD",
        searchQuery: "Radiohead Karma Police",
        fallbackBarcode: "4988006729254",
        fallbackCover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=800&q=80",
        fallbackTracks: [
          { n: "01", t: "AIRBAG", l: "04:44" },
          { n: "02", t: "PARANOID ANDROID", l: "06:23" },
          { n: "03", t: "SUBTERRANEAN HOMESICK", l: "04:27" },
          { n: "04", t: "EXIT MUSIC (FOR A FILM)", l: "04:24" },
          { n: "05", t: "KARMA POLICE", l: "04:21" }
        ]
      }
    ];

    let currentMbIndex = 0;
    let customMetadata = { title: "CUSTOM MEDIA", artist: "USER IMPORT", tracklist: null, barcode: null };

    // ==========================================
    // AUDIO ENGINE (iTunes Search API Integration)
    // ==========================================
    const audioEl = document.getElementById('audioElement');
    let isAudioPlaying = false;
    let currentPreviewUrl = null;
    let activeTrackTitle = "NO AUDIO";

    async function fetchItunesAudioPreview(term) {
      const trackNameEl = document.getElementById('audioTrackName');
      const trackStatusEl = document.getElementById('audioTrackStatus');
      trackStatusEl.innerText = "Mencari di iTunes...";

      try {
        const query = encodeURIComponent(term);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        if (!res.ok) throw new Error("iTunes request error");
        const json = await res.json();

        if (json.results && json.results.length > 0) {
          const song = json.results[0];
          currentPreviewUrl = song.previewUrl;
          activeTrackTitle = song.trackName.toUpperCase();
          trackNameEl.innerText = activeTrackTitle;
          trackStatusEl.innerText = `iTunes 30s • ${song.artistName.toUpperCase()}`;
          audioEl.src = currentPreviewUrl;
          
          showToast(`Lagu dimuat: ${song.trackName} (iTunes Preview)`);
          
          // Autoplay jika disc sedang berputar
          if (isDiscSpinning) {
            playAudio();
          }
        } else {
          trackStatusEl.innerText = "Audio tidak ditemukan";
          audioEl.src = "";
          currentPreviewUrl = null;
        }
      } catch (e) {
        console.warn("Gagal memuat iTunes audio:", e);
        trackStatusEl.innerText = "Preview audio gagal dimuat";
      }
    }

    function playAudio() {
      if (!audioEl.src) return;
      audioEl.play().then(() => {
        isAudioPlaying = true;
        updateAudioUI(true);
        if (!isDiscSpinning) {
          toggleSpin();
        }
      }).catch(err => {
        console.log("Autoplay diblokir oleh browser sampai ada interaksi user:", err);
        isAudioPlaying = false;
        updateAudioUI(false);
      });
    }

    function pauseAudio() {
      audioEl.pause();
      isAudioPlaying = false;
      updateAudioUI(false);
    }

    function toggleAudioPlayback() {
      if (isAudioPlaying) {
        pauseAudio();
      } else {
        if (audioEl.src) {
          playAudio();
        } else {
          showToast("Silakan klik 'Next Album' untuk memuat lagu.");
        }
      }
    }

    function updateAudioUI(playing) {
      const audioIcon = document.getElementById('audioIcon');
      const audioPlayText = document.getElementById('audioPlayText');
      const widgetPlayIcon = document.getElementById('widgetPlayIcon');
      const eqBars = [document.getElementById('eqBar1'), document.getElementById('eqBar2'), document.getElementById('eqBar3'), document.getElementById('eqBar4')];

      if (playing) {
        audioIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        audioPlayText.innerText = "Pause";
        widgetPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        eqBars.forEach((bar, idx) => {
          bar.classList.add('animate-pulse');
          bar.style.animationDuration = `${0.35 + (idx * 0.15)}s`;
        });
      } else {
        audioIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        audioPlayText.innerText = "Play Audio";
        widgetPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        eqBars.forEach(bar => {
          bar.classList.remove('animate-pulse');
          bar.style.height = "6px";
        });
      }
    }

    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      document.getElementById('audioProgressBar').style.width = pct + '%';
      const curMin = Math.floor(audioEl.currentTime / 60);
      const curSec = Math.floor(audioEl.currentTime % 60).toString().padStart(2, '0');
      document.getElementById('audioTimeDisplay').innerText = `${curMin}:${curSec}`;
    });

    audioEl.addEventListener('ended', () => {
      isAudioPlaying = false;
      updateAudioUI(false);
      document.getElementById('audioProgressBar').style.width = '0%';
    });

    // Helper untuk menampilkan status info di UI tanpa alert()
    function showToast(message, duration = 3000) {
      const toast = document.getElementById('statusToast');
      if (!toast) return;
      toast.innerText = message;
      toast.classList.remove('hidden');
      toast.classList.add('opacity-100');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, duration);
    }

    // ==========================================
    // 2. VARIABEL 3D & ENGINE STATE
    // ==========================================
    let scene, camera, renderer;
    let cdAssembly, caseLidGroup, cdDiscGroup, cdDiscMesh;
    let isOpen = false, targetLidAngle = 0.0, currentLidAngle = 0.0;
    let isDiscSpinning = true, currentCoverIndex = 0;
    let frontCoverTexture, backCoverTexture, discTexture, cdIridescenceMaterial;
    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    
    let targetRotX = 0.25, targetRotY = -0.45;
    let currentRotX = 0.25, currentRotY = -0.45;
    let currentCustomImage = null;

    const OPEN_OFFSET_X = 1.2;
    const LID_OPEN_ANGLE = -Math.PI * 0.78;

    let isDiscOut = false, discOutAmt = 0, bobAmp = 1;
    let rafId = 0, lastFrameTime = 0;
    let shadowGroup, shadowMesh;
    let maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    let currentPixelRatio = maxPixelRatio;
    const perf = { frames: 0, acc: 0, ignore: 90 };
    
    const smoothstep = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function makeCanvasTexture(canvas, srgb) {
      const t = new THREE.CanvasTexture(canvas);
      t.anisotropy = 8; if (srgb) t.encoding = THREE.sRGBEncoding;
      return t;
    }

    const albumThemes = [
      { title: "NEO TOKYO '98", artist: "SYNTHETIX CORE", bg: ["#1e3a8a", "#4338ca", "#db2777"], accent: "#22d3ee", pageBg: "#8fa0b5" },
      { title: "MINIMAL DRIFT", artist: "ARCHITECTURAL", bg: ["#020617", "#1e293b", "#475569"], accent: "#facc15", pageBg: "#cbd5e1" },
      { title: "SOLAR HORIZON", artist: "AMBER ECHOES", bg: ["#9a3412", "#e11d48", "#6d28d9"], accent: "#fef08a", pageBg: "#292524" }
    ];

    // ==========================================
    // 3. GENERATOR TEKSTUR COVER & DISC
    // ==========================================
    function generateFrontCoverTexture(themeIndex, customImg = null) {
      const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const rand = mulberry32(1000 + themeIndex * 17 + (customImg ? 1 : 0));
      const theme = albumThemes[themeIndex];

      if (customImg) {
        const size = Math.min(customImg.width, customImg.height);
        const startX = (customImg.width - size) / 2; const startY = (customImg.height - size) / 2;
        ctx.drawImage(customImg, startX, startY, size, size, 0, 0, 1024, 1024);
        
        const vig = ctx.createRadialGradient(512, 512, 200, 512, 512, 800);
        vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(0,0,0,0.6)");
        ctx.fillStyle = vig; ctx.fillRect(0,0,1024,1024);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
        grad.addColorStop(0, theme.bg[0]); grad.addColorStop(0.5, theme.bg[1]); grad.addColorStop(1, theme.bg[2]);
        ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 1024);

        ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
        for(let i = -1024; i < 2048; i += 24) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 1024, 1024); ctx.stroke(); }
        
        for(let i = 0; i < 4; i++) {
          const x = rand() * 1024; const y = rand() * 1024; const r = rand() * 300 + 100;
          const blobGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
          blobGrad.addColorStop(0, theme.accent + "44"); blobGrad.addColorStop(1, "transparent");
          ctx.fillStyle = blobGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }

        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)"; ctx.lineWidth = 1;
        for (let i = 0; i <= 1024; i += 64) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke(); }
      }
      return makeCanvasTexture(canvas, true);
    }

    function generateBackCoverTexture(themeIndex, customImg = null) {
      const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const rand = mulberry32(5000 + themeIndex * 31 + (customImg ? 1 : 0));
      const theme = albumThemes[themeIndex];
      let title = theme.title, artist = theme.artist, accent = theme.accent, spineBg = theme.bg[0];

      ctx.fillStyle = "#0a0f18"; ctx.fillRect(0, 0, 1024, 1024);

      if (customImg) {
        const size = Math.min(customImg.width, customImg.height);
        const startX = (customImg.width - size) / 2; const startY = (customImg.height - size) / 2;
        const small = document.createElement('canvas'); small.width = 48; small.height = 48;
        const sctx = small.getContext('2d');
        sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(customImg, startX, startY, size, size, 0, 0, 48, 48);

      const baseShape = getRoundedRectShape(caseW, caseH, cornerRadius);
      const plateGeo = new THREE.ExtrudeGeometry(baseShape, { depth: t, bevelEnabled: false }); plateGeo.translate(0, 0, -t/2);

      const rimShape = getRoundedRectShape(caseW, caseH, cornerRadius);
      const holeShape = getRoundedRectShape(caseW - rimThick*2, caseH - rimThick*2, Math.max(0, cornerRadius - rimThick));
      rimShape.holes.push(holeShape);
      const rimGeo = new THREE.ExtrudeGeometry(rimShape, { depth: edgeDepth, bevelEnabled: false }); rimGeo.translate(0, 0, -edgeDepth/2);

      // Back Group
      const backGroup = new THREE.Group();
      const backPlate = new THREE.Mesh(plateGeo, clearAcrylicMaterial); backPlate.position.z = -caseD/2 + t/2; backGroup.add(backPlate);
      const backRim = new THREE.Mesh(rimGeo, clearEdgeMaterial); backRim.position.z = -caseD/4; backGroup.add(backRim);

      frontCoverTexture = generateFrontCoverTexture(currentCoverIndex, currentCustomImage);
      backCoverTexture = generateBackCoverTexture(currentCoverIndex, currentCustomImage);

      const inlayGeo = new THREE.PlaneGeometry(caseW - rimThick*2 - 0.01, caseH - rimThick*2 - 0.01);
      const trayOutsideMat = new THREE.MeshStandardMaterial({ map: backCoverTexture, roughness: 0.8, metalness: 0 });
      const trayOutside = new THREE.Mesh(inlayGeo, trayOutsideMat); trayOutside.name = "trayOutside"; trayOutside.rotation.y = Math.PI; trayOutside.position.z = -caseD/2 + t + 0.001; backGroup.add(trayOutside);
      const trayInsideMat = new THREE.MeshStandardMaterial({ map: frontCoverTexture, roughness: 0.8, metalness: 0 });
      const trayInside = new THREE.Mesh(inlayGeo, trayInsideMat); trayInside.name = "trayInside"; trayInside.position.z = -caseD/2 + t + 0.002; backGroup.add(trayInside);

      // Frame L-brackets
      const frameGroup = new THREE.Group(); frameGroup.position.z = -caseD/2 + t + 0.015;
      const bracketDistX = caseW/2 - rimThick - 0.12, bracketDistY = caseH/2 - rimThick - 0.12;
      const bLength = 0.45, bThick = 0.06, bHeight = 0.12;

      const frameParts = [];
      [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([dirX, dirY]) => {
        frameParts.push(new THREE.BoxGeometry(bLength, bThick, bHeight).translate(dirX * (bracketDistX - bLength/2 + bThick/2), dirY * bracketDistY, 0));
        frameParts.push(new THREE.BoxGeometry(bThick, bLength - bThick, bHeight).translate(dirX * bracketDistX, dirY * (bracketDistY - bLength/2), 0));
      });
      [[1.2, 0], [-1.2, 0], [0, 1.15], [0, -1.15]].forEach(([x, y]) => { frameParts.push(new THREE.BoxGeometry(0.08, 0.08, 0.12).translate(x, y, 0)); });
      frameParts.push(new THREE.CylinderGeometry(0.18, 0.18, 0.08, 32).rotateX(Math.PI/2));
      for (let k = 0; k < 4; k++) frameParts.push(new THREE.BoxGeometry(0.05, 0.05, 0.12).translate(Math.cos(k * Math.PI/2) * 0.13, Math.sin(k * Math.PI/2) * 0.13, 0.03));
      
      frameGroup.add(new THREE.Mesh(mergeGeometries(frameParts), clearEdgeMaterial));
      backGroup.add(frameGroup); cdAssembly.add(backGroup);

      // CD Disc
      cdDiscGroup = new THREE.Group(); cdDiscGroup.position.set(0, 0, frameGroup.position.z + 0.04); cdDiscGroup.userData.baseZ = cdDiscGroup.position.z;
      const discGeo = new THREE.CylinderGeometry(1.15, 1.15, 0.012, 64); discGeo.rotateX(Math.PI / 2);
      discTexture = generateDiscTexture(currentCoverIndex, currentCustomImage);
      if(!cdIridescenceMaterial) cdIridescenceMaterial = createCDMaterial(discTexture);
      cdDiscMesh = new THREE.Mesh(discGeo, cdIridescenceMaterial); cdDiscGroup.add(cdDiscMesh); cdAssembly.add(cdDiscGroup);

      // Front Lid
      caseLidGroup = new THREE.Group(); caseLidGroup.position.set(-caseW/2, 0, 0);
      const lidPlate = new THREE.Mesh(plateGeo, clearAcrylicMaterial); lidPlate.position.set(caseW/2, 0, caseD/2 - t/2); caseLidGroup.add(lidPlate);
      const lidRim = new THREE.Mesh(rimGeo, clearEdgeMaterial); lidRim.position.set(caseW/2, 0, caseD/4); caseLidGroup.add(lidRim);

      lidLabelTexture = generateLidLabelTexture(currentCoverIndex, currentCustomImage, currentLidShape);
      lidLabelMesh = new THREE.Mesh(new THREE.PlaneGeometry(caseW, caseH), new THREE.MeshBasicMaterial({ map: lidLabelTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
      lidLabelMesh.name = "lidLabel"; lidLabelMesh.position.set(caseW / 2, 0, caseD / 2 + 0.003); caseLidGroup.add(lidLabelMesh);

      cdAssembly.add(caseLidGroup);
      targetLidAngle = isOpen ? -Math.PI * 0.78 : 0; currentLidAngle = targetLidAngle; caseLidGroup.rotation.y = currentLidAngle;
      cdAssembly.userData.targetPosX = isOpen ? OPEN_OFFSET_X : 0.0; cdAssembly.position.x = cdAssembly.userData.targetPosX;
    }

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene(); scene.environment = createProceduralEnvMap();
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100); camera.position.set(0, 0, 8.0);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      applyPixelRatio(); renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.4); keyLight.position.set(5, 8, 5); scene.add(keyLight);
      const softFill = new THREE.DirectionalLight(0xe0e7ff, 0.6); softFill.position.set(-5, 4, 3); scene.add(softFill);
      const subtleRim = new THREE.PointLight(0x60a5fa, 0.8, 12); subtleRim.position.set(-3, -3, -2); scene.add(subtleRim);

      createGroundShadow();
      buildProceduralCDAssembly(); setupInteractions(); setupUIEvents();
      window.addEventListener('resize', onWindowResize);
    }

    function prepareCustomImage(img, maxSide = 2048) {
      const size = Math.min(img.width, img.height), target = Math.min(size, maxSide);
      const c = document.createElement('canvas'); c.width = c.height = target; const cx = c.getContext('2d');
      cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
      cx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, target, target); return c;
    }

    function updateTextures() {
      const oldTextures = [frontCoverTexture, backCoverTexture, discTexture];
      frontCoverTexture = generateFrontCoverTexture(currentCoverIndex, currentCustomImage);
      backCoverTexture = generateBackCoverTexture(currentCoverIndex, currentCustomImage);
      discTexture = generateDiscTexture(currentCoverIndex, currentCustomImage);

      const trayInsideMesh = scene.getObjectByName("trayInside"); if (trayInsideMesh) { trayInsideMesh.material.map = frontCoverTexture; trayInsideMesh.material.needsUpdate = true; }
      const trayOutsideMesh = scene.getObjectByName("trayOutside"); if (trayOutsideMesh) { trayOutsideMesh.material.map = backCoverTexture; trayOutsideMesh.material.needsUpdate = true; }
      if (cdIridescenceMaterial) cdIridescenceMaterial.uniforms.uCoverTex.value = discTexture;
      oldTextures.forEach(t => { if (t) t.dispose(); }); refreshLidLabel();

      if(currentCustomImage) {
         document.getElementById('albumTitleDisplay').innerText = customMetadata.title; document.getElementById('albumArtistDisplay').innerText = customMetadata.artist;
         document.body.style.backgroundColor = "#18181b";
      } else {
         const theme = albumThemes[currentCoverIndex];
         document.getElementById('albumTitleDisplay').innerText = theme.title; document.getElementById('albumArtistDisplay').innerText = theme.artist;
         document.body.style.backgroundColor = theme.pageBg;
      }
    }

    // ==============================================================
    // 6. IMPLEMENTASI FETCH API MUSICBRAINZ + ITUNES AUDIO PREVIEW
    // ==============================================================
    async function fetchMusicBrainzAlbum(albumConfig) {
      const btnText = document.getElementById('mbBtnText');
      const mbid = albumConfig.mbid;
      btnText.innerText = "Mengambil Data...";
      showToast(`Mengambil data MBID: ${mbid.substring(0, 8)}...`);

      try {
        // 1. Request Metadata Album ke MusicBrainz API (Format JSON)
        const mbRes = await fetch(`https://musicbrainz.org/ws/2/release/${mbid}?inc=recordings+artists&fmt=json`, {
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!mbRes.ok) {
          throw new Error(`MusicBrainz Error: ${mbRes.status}`);
        }
        
        const data = await mbRes.json();

        // 2. Olah Metadata (Title, Artist, Barcode, Tracklist)
        const albumTitle = (data.title || albumConfig.fallbackTitle).toUpperCase();
        const artistName = (data['artist-credit']?.[0]?.name || albumConfig.fallbackArtist).toUpperCase();
        const barcode = data.barcode || albumConfig.fallbackBarcode;

        let tracklist = [];
        let firstTrackName = "";
        if (data.media && data.media[0] && data.media[0].tracks && data.media[0].tracks.length > 0) {
          firstTrackName = data.media[0].tracks[0].title;
          tracklist = data.media[0].tracks.slice(0, 6).map((t, idx) => {
            const min = Math.floor((t.length || 180000) / 60000);
            const sec = Math.floor(((t.length || 180000) % 60000) / 1000).toString().padStart(2, '0');
            return {
              n: String(idx + 1).padStart(2, '0'),
              t: (t.title || `TRACK ${idx + 1}`).toUpperCase(),
              l: `${min}:${sec}`
            };
          });
        } else {
          tracklist = albumConfig.fallbackTracks;
          firstTrackName = albumConfig.fallbackTracks[0].t;
        }

        customMetadata = {
          title: albumTitle,
          artist: artistName,
          barcode: barcode,
          tracklist: tracklist
        };

        // 3. Ambil Cover Art dari Cover Art Archive
        const coverUrl = `https://coverartarchive.org/release/${mbid}/front-500.jpg`;
        btnText.innerText = "Memuat Cover...";

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          currentCustomImage = prepareCustomImage(img);
          updateTextures();
          const shortTitle = albumTitle.length > 15 ? albumTitle.substring(0, 15) + "..." : albumTitle;
          btnText.innerText = `Loaded: ${shortTitle}`;
          showToast(`Berhasil sinkron: ${albumTitle}`);

          // 4. Sinkronisasi Audio Preview melalui iTunes API
          const searchTerm = albumConfig.searchQuery || `${artistName} ${firstTrackName}`;
          fetchItunesAudioPreview(searchTerm);
        };
        img.onerror = () => {
          console.warn("Cover Art Archive tidak merespons, memuat fallback artwork.");
          const fallbackImg = new Image();
          fallbackImg.crossOrigin = "anonymous";
          fallbackImg.onload = () => {
            currentCustomImage = prepareCustomImage(fallbackImg);
            updateTextures();
            btnText.innerText = `Loaded (HQ Art)`;
            showToast(`Data dimuat dengan fallback cover: ${albumTitle}`);
            
            // Tetap fetch iTunes audio preview
            const searchTerm = albumConfig.searchQuery || `${artistName} ${firstTrackName}`;
            fetchItunesAudioPreview(searchTerm);
          };
          fallbackImg.onerror = () => {
            currentCustomImage = null;
            updateTextures();
            btnText.innerText = `Loaded (Procedural)`;
          };
          fallbackImg.src = albumConfig.fallbackCover;
        };
        img.src = coverUrl;

      } catch (err) {
        console.warn("Gagal terhubung ke MusicBrainz API, mengaktifkan data fallback lokal:", err);
        
        customMetadata = {
          title: albumConfig.fallbackTitle,
          artist: albumConfig.fallbackArtist,
          barcode: albumConfig.fallbackBarcode,
          tracklist: albumConfig.fallbackTracks
        };

        const fallbackImg = new Image();
        fallbackImg.crossOrigin = "anonymous";
        fallbackImg.onload = () => {
          currentCustomImage = prepareCustomImage(fallbackImg);
          updateTextures();
          btnText.innerText = `Offline: ${albumConfig.fallbackTitle.substring(0, 14)}`;
          showToast(`Offline mode aktif untuk ${albumConfig.fallbackTitle}`);

          // Fetch preview audio untuk fallback track
          fetchItunesAudioPreview(albumConfig.searchQuery);
        };
        fallbackImg.src = albumConfig.fallbackCover;
      }
    }

    // ==========================================
    // 7. EVENT & INTERAKSI
    // ==========================================
    function setupInteractions() {
      const container = document.getElementById('canvas-container');
      let startX = 0, startY = 0, hasDragged = false, activePointerId = null;
      const clampX = v => Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, v));
      function onPointerDown(e) { if (e.pointerType === 'mouse' && e.button !== 0) return; if (activePointerId !== null) return; isDragging = true; activePointerId = e.pointerId; prevMouseX = startX = e.clientX; prevMouseY = startY = e.clientY; hasDragged = false; try { container.setPointerCapture(e.pointerId); } catch (_) {} }
      function onPointerMove(e) { if (!isDragging || e.pointerId !== activePointerId) return; if (Math.hypot(e.clientX - startX, e.clientY - startY) > 6) hasDragged = true; targetRotY += (e.clientX - prevMouseX) * 0.006; targetRotX = clampX(targetRotX + (e.clientY - prevMouseY) * 0.006); prevMouseX = e.clientX; prevMouseY = e.clientY; invalidate(); }
      function endDrag(e, allowToggle) { if (!isDragging || e.pointerId !== activePointerId) return; isDragging = false; activePointerId = null; try { container.releasePointerCapture(e.pointerId); } catch (_) {} if (allowToggle && !hasDragged) toggleCase(); }
      container.addEventListener('pointerdown', onPointerDown); window.addEventListener('pointermove', onPointerMove); window.addEventListener('pointerup', e => endDrag(e, true)); window.addEventListener('pointercancel', e => endDrag(e, false));
    }

    function toggleCase() {
      isOpen = !isOpen; if (!isOpen) isDiscOut = false;
      document.getElementById('caseStateText').innerText = isOpen ? "Tutup Casing" : "Buka Casing"; updateEjectButton(); invalidate();
    }
    function toggleDiscOut() { isDiscOut = !isDiscOut; if (isDiscOut && !isOpen) toggleCase(); updateEjectButton(); invalidate(); }
    function updateEjectButton() { const b = document.getElementById('ejectDiscBtn'); if (b) b.textContent = isDiscOut ? 'Masukkan CD' : 'Keluarkan CD'; }

    function toggleSpin() {
      isDiscSpinning = !isDiscSpinning; 
      invalidate(); 
      const icon = document.getElementById('spinIcon'); 
      const text = document.getElementById('spinStateText'); 
      if (isDiscSpinning) { 
        icon.classList.add('animate-spin'); 
        text.innerText = "Stop Putar"; 
        if (!isAudioPlaying && audioEl.src) playAudio();
      } else { 
        icon.classList.remove('animate-spin'); 
        text.innerText = "Putar CD"; 
        if (isAudioPlaying) pauseAudio();
      }
    }

    function setupUIEvents() {
      document.getElementById('toggleCaseBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleCase(); });
      document.getElementById('toggleSpinBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleSpin(); });
      document.getElementById('changeCoverBtn').addEventListener('click', (e) => { e.stopPropagation(); currentCustomImage = null; currentCoverIndex = (currentCoverIndex + 1) % albumThemes.length; updateTextures(); });
      document.getElementById('changeLabelBtn').addEventListener('click', (e) => { e.stopPropagation(); currentLidShape = (currentLidShape + 1) % lidShapes.length; refreshLidLabel(); });
      document.getElementById('ejectDiscBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleDiscOut(); });
      
      // Audio playback triggers
      document.getElementById('audioPlayBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleAudioPlayback(); });
      document.getElementById('widgetPlayToggle').addEventListener('click', (e) => { e.stopPropagation(); toggleAudioPlayback(); });

      const fileInput = document.getElementById('imageUploadInput');
      document.getElementById('uploadImageBtn').addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
      fileInput.addEventListener('change', (e) => {
         const file = e.target.files[0]; if (!file) return;
         const url = URL.createObjectURL(file); const img = new Image();
         img.onload = () => { 
           URL.revokeObjectURL(url); 
           customMetadata = { title: "MY CUSTOM DISC", artist: "LOCAL USER", tracklist: null, barcode: null }; 
           currentCustomImage = prepareCustomImage(img); 
           updateTextures(); 
           showToast("Foto kustom berhasil dipasang!");
         };
         img.onerror = () => { 
           URL.revokeObjectURL(url); 
           showToast("Gagal memuat gambar dari perangkat."); 
         }; 
         img.src = url; fileInput.value = ''; 
      });

      // Tombol MusicBrainz Sync
      document.getElementById('mbSyncBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const selected = musicBrainzAlbums[currentMbIndex];
        fetchMusicBrainzAlbum(selected);
        currentMbIndex = (currentMbIndex + 1) % musicBrainzAlbums.length;
      });

      document.getElementById('resetCamBtn').addEventListener('click', (e) => { e.stopPropagation(); targetRotX = 0.25; targetRotY = -0.45; invalidate(); });
    }

    function invalidate() { if (!rafId && renderer) rafId = requestAnimationFrame(animate); }
    function applyPixelRatio() { renderer.setPixelRatio(currentPixelRatio); renderer.setSize(window.innerWidth, window.innerHeight); }
    function onWindowResize() { const prevMax = maxPixelRatio; maxPixelRatio = Math.min(window.devicePixelRatio || 1, 2); currentPixelRatio = maxPixelRatio !== prevMax ? maxPixelRatio : Math.min(currentPixelRatio, maxPixelRatio); perf.ignore = Math.max(perf.ignore, 30); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); applyPixelRatio(); invalidate(); }
    function adaptPixelRatio(dt) { if (dt > 0.1) { perf.frames = 0; perf.acc = 0; return; } if (perf.ignore > 0) { perf.ignore--; return; } perf.acc += dt; perf.frames++; if (perf.frames >= 40) { const avg = perf.acc / perf.frames; perf.frames = 0; perf.acc = 0; if (avg > 1 / 40 && currentPixelRatio > 1) { currentPixelRatio = Math.max(1, currentPixelRatio - 0.25); applyPixelRatio(); perf.ignore = 20; } } }

    function animate(now) {
      rafId = 0; const hadPrev = lastFrameTime > 0; const rawDt = hadPrev ? (now - lastFrameTime) / 1000 : 0.016; lastFrameTime = now;
      if (hadPrev) adaptPixelRatio(rawDt); const f = Math.min(rawDt, 0.05) * 60; 
      const approach = (cur, tgt, rate, eps = 0.0005) => { const n = cur + (tgt - cur) * (1 - Math.pow(1 - rate, f)); return Math.abs(tgt - n) < eps ? tgt : n; };

      currentRotX = approach(currentRotX, targetRotX, 0.08); currentRotY = approach(currentRotY, targetRotY, 0.08);

      const holdOpen = isOpen || discOutAmt > 0.12;
      targetLidAngle = holdOpen ? LID_OPEN_ANGLE : 0.0; const targetPosX = holdOpen ? OPEN_OFFSET_X : 0.0;
      currentLidAngle = approach(currentLidAngle, targetLidAngle, 0.1);
      const openProgress = currentLidAngle / LID_OPEN_ANGLE; const discTarget = (isDiscOut && isOpen && openProgress > 0.85) ? 1 : 0;
      discOutAmt = approach(discOutAmt, discTarget, 0.07, 0.0015);
      const spinTarget = isDiscSpinning ? 1 : 0; bobAmp = approach(bobAmp, spinTarget, 0.06, 0.002);
      const bobY = Math.sin((now / 1000) * 1.6) * 0.06 * bobAmp;

      if (cdAssembly) { cdAssembly.rotation.x = currentRotX; cdAssembly.rotation.y = currentRotY; cdAssembly.position.y = bobY; cdAssembly.position.x = approach(cdAssembly.position.x, targetPosX, 0.08); }
      if (caseLidGroup) caseLidGroup.rotation.y = currentLidAngle;
      if (cdDiscGroup) { const lift = smoothstep(0, 0.45, discOutAmt), rise = smoothstep(0.3, 1, discOutAmt); cdDiscGroup.position.set(0, 1.15 * rise, cdDiscGroup.userData.baseZ + 0.6 * lift); cdDiscGroup.rotation.x = -0.5 * rise; }
      if (cdDiscMesh && isDiscSpinning) cdDiscMesh.rotation.z += 0.022 * f;
      updateShadow(bobY); renderer.render(scene, camera);

      const animating = isDiscSpinning || currentRotX !== targetRotX || currentRotY !== targetRotY || currentLidAngle !== targetLidAngle || discOutAmt !== discTarget || bobAmp !== spinTarget || (cdAssembly && cdAssembly.position.x !== targetPosX);
      if (animating) rafId = requestAnimationFrame(animate); else lastFrameTime = 0;
    }

    window.onload = async function() {
      try { await Promise.race([Promise.all([document.fonts.load("bold 72px 'Space Mono'"), document.fonts.load("24px 'Space Mono'"), document.fonts.load("600 32px 'Plus Jakarta Sans'")]), new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
      init(); invalidate();
    };
  </script>
