    // ==========================================
    // AUDIO ENGINE (iTunes Search API Integration)
    // ==========================================
    const audioEl = document.getElementById('audioElement');
    let isAudioPlaying = false;
    let currentPreviewUrl = null;
    let activeTrackTitle = "NO AUDIO";

    async function fetchItunesAudioPreview(term) {
      const trackNameEl = document.getElementById('audioTrackName');
      const trackStatusEl = document.getElementById('audioTrackStatus');
      trackStatusEl.innerText = "Mencari di iTunes...";

      try {
        const query = encodeURIComponent(term);
        const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
        if (!res.ok) throw new Error("iTunes request error");
        const json = await res.json();

        if (json.results && json.results.length > 0) {
          const song = json.results[0];
          currentPreviewUrl = song.previewUrl;
          activeTrackTitle = song.trackName.toUpperCase();
          trackNameEl.innerText = activeTrackTitle;
          trackStatusEl.innerText = `iTunes 30s • ${song.artistName.toUpperCase()}`;
          audioEl.src = currentPreviewUrl;

          showToast(`Lagu dimuat: ${song.trackName} (iTunes Preview)`);

          // Autoplay jika disc sedang berputar
          if (isDiscSpinning) {
            playAudio();
          }
        } else {
          trackStatusEl.innerText = "Audio tidak ditemukan";
          audioEl.src = "";
          currentPreviewUrl = null;
        }
      } catch (e) {
        console.warn("Gagal memuat iTunes audio:", e);
        trackStatusEl.innerText = "Preview audio gagal dimuat";
      }
    }

    function playAudio() {
      if (!audioEl.src) return;
      audioEl.play().then(() => {
        isAudioPlaying = true;
        updateAudioUI(true);
        if (!isDiscSpinning) {
          toggleSpin();
        }
      }).catch(err => {
        console.log("Autoplay diblokir oleh browser sampai ada interaksi user:", err);
        isAudioPlaying = false;
        updateAudioUI(false);
      });
    }

    function pauseAudio() {
      audioEl.pause();
      isAudioPlaying = false;
      updateAudioUI(false);
    }

    function toggleAudioPlayback() {
      if (isAudioPlaying) {
        pauseAudio();
      } else {
        if (audioEl.src) {
          playAudio();
        } else {
          showToast("Silakan klik 'Next Album' untuk memuat lagu.");
        }
      }
    }

        desktopRackGroup.traverse(obj => {

      const tiltX = -0.15;

      const wallPositions = [-rackW / 2 + wallThickness / 2, 0, rackW / 2 - wallThickness / 2];

        const wallGrp = new THREE.Group();

      const caseW = 2.45, caseH = 2.25, caseD = 0.22;

          new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 }),

    // ==============================================================

    async function fetchMusicBrainzAlbum(albumConfig) {
      const btnText = document.getElementById('mbBtnText');
      const mbid = albumConfig.mbid;
      btnText.innerText = "Mengambil Data...";
      applySkeletonPhase();

      showToast(`Mengambil data MBID: ${mbid.substring(0, 8)}...`);

      try {
        // 1. Request Metadata Album ke MusicBrainz API (Format JSON)
        const mbRes = await fetch(`https://musicbrainz.org/ws/2/release/${mbid}?inc=recordings+artists&fmt=json`, {
          headers: {
            'Accept': 'application/json'

        if (!mbRes.ok) {
          throw new Error(`MusicBrainz Error: ${mbRes.status}`);
        }

        const data = await mbRes.json();

        // 2. Olah Metadata (Title, Artist, Barcode, Tracklist)
        const albumTitle = (data.title || albumConfig.fallbackTitle).toUpperCase();
        const artistName = (data['artist-credit']?.[0]?.name || albumConfig.fallbackArtist).toUpperCase();
        const barcode = data.barcode || albumConfig.fallbackBarcode;

        let tracklist = [];

          tracklist = data.media[0].tracks.slice(0, 6).map((t, idx) => {
            const min = Math.floor((t.length || 180000) / 60000);
            const sec = Math.floor(((t.length || 180000) % 60000) / 1000).toString().padStart(2, '0');
            return {
              n: String(idx + 1).padStart(2, '0'),
              t: (t.title || `TRACK ${idx + 1}`).toUpperCase(),

          tracklist = albumConfig.fallbackTracks;
          firstTrackName = albumConfig.fallbackTracks[0].t;

        customMetadata = {
          title: albumTitle,
          artist: artistName,
          barcode: barcode,
          tracklist: tracklist

        btnText.innerText = "Memuat Cover...";

          pendingAlbumDataReady = true;

            isOpen = true;

            rackSwapState = 'IDLE';
            invalidate();

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          currentCustomImage = prepareCustomImage(img);
          const shortTitle = albumTitle.length > 15 ? albumTitle.substring(0, 15) + "..." : albumTitle;
          btnText.innerText = `Loaded: ${shortTitle}`;
          showToast(`Berhasil sinkron: ${albumTitle}`);
          triggerAlbumReveal();

          // 4. Sinkronisasi Audio Preview melalui iTunes API
          const searchTerm = albumConfig.searchQuery || `${artistName} ${firstTrackName}`;
          fetchItunesAudioPreview(searchTerm);
        };
        img.onerror = () => {
          console.warn("Cover Art Archive tidak merespons, memuat fallback artwork.");
          const fallbackImg = new Image();
          fallbackImg.crossOrigin = "anonymous";
          fallbackImg.onload = () => {
            currentCustomImage = prepareCustomImage(fallbackImg);
            btnText.innerText = `Loaded (HQ Art)`;
            showToast(`Data dimuat dengan fallback cover: ${albumTitle}`);
            triggerAlbumReveal();

            // Tetap fetch iTunes audio preview
            const searchTerm = albumConfig.searchQuery || `${artistName} ${firstTrackName}`;
            fetchItunesAudioPreview(searchTerm);
          };
          fallbackImg.onerror = () => {
            currentCustomImage = null;
            btnText.innerText = `Loaded (Procedural)`;
            triggerAlbumReveal();
          };
          fallbackImg.src = albumConfig.fallbackCover;
        };

      } catch (err) {
        console.warn("Gagal terhubung ke MusicBrainz API, mengaktifkan data fallback lokal:", err);

        customMetadata = {
          title: albumConfig.fallbackTitle,
          artist: albumConfig.fallbackArtist,
          barcode: albumConfig.fallbackBarcode,
          tracklist: albumConfig.fallbackTracks

          showToast(`Offline mode aktif untuk ${albumConfig.fallbackTitle}`);
          pendingAlbumDataReady = true;

            updateTextures();

            document.getElementById('caseStateText').innerText = "Tutup Casing";
            rackSwapState = 'IDLE';
            invalidate();
          }
          fetchItunesAudioPreview(albumConfig.searchQuery);
        };
        fallbackImg.onerror = () => {
          currentCustomImage = null;
          btnText.innerText = `Offline: Fallback`;
          pendingAlbumDataReady = true;
          if (rackSwapState === 'LOADING') {
            updateTextures();
            isOpen = true;
            document.getElementById('caseStateText').innerText = "Tutup Casing";

          }

    // startRackSwap: inisiasi animasi docking fisik ke rak akrilik 14-slot (Return-then-Retrieve)
    function startRackSwap(targetArg) {
      if (rackSwapState !== 'IDLE') return;
      let targetIdx = 0;
      if (typeof targetArg === 'number') {
        targetIdx = targetArg;
      } else if (targetArg && targetArg.slotIndex !== undefined) {
        targetIdx = targetArg.slotIndex;
      } else {
        targetIdx = (currentSlotIndex + 1) % musicBrainzAlbums.length;
      }

      if (targetIdx === currentSlotIndex) return;

      _returnSlotIndex = currentSlotIndex;
      _targetSlotIndex = targetIdx;
      _swapAlbumConfig = musicBrainzAlbums[_targetSlotIndex];
      pendingAlbumDataReady = false;
      isOpen = false;
      isDiscOut = false;
      updateEjectButton();
      document.getElementById('caseStateText').innerText = "Buka Casing";
      showToast(`Mengembalikan kaset ke Slot ${_returnSlotIndex + 1} & mengambil Slot ${_targetSlotIndex + 1} (${_swapAlbumConfig.fallbackTitle})...`);
      rackSwapState = 'RETURN_CLOSE';
      invalidate();
    }

    // ==========================================
    // 7. EVENT & INTERAKSI
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();

    function handlePointerClick(e) {
      const container = document.getElementById('canvas-container');
      const rect = container.getBoundingClientRect();
      mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouseVec, camera);

      // Cek apakah klik mengenai salah satu kaset koleksi di rak
      const dummyHitList = [];
      rackDummyCases.forEach((grp, sIdx) => {
        if (grp && grp.visible) {
          grp.traverse(child => {
            if (child.isMesh) {
              child.userData.slotIndex = sIdx;
              dummyHitList.push(child);
            }
          });
        }
      });

      const hits = raycaster.intersectObjects(dummyHitList, false);
      if (hits.length > 0) {
        const hitSlot = hits[0].object.userData.slotIndex;
        if (hitSlot !== undefined && hitSlot !== currentSlotIndex) {
          startRackSwap(hitSlot);
          return;
        }
      }

      // Jika klik di luar kaset rak, buka/tutup casing aktif di panggung
      toggleCase();
    }

    function setupInteractions() {

    function toggleCase() {

    }
    function toggleDiscOut() { isDiscOut = !isDiscOut; if (isDiscOut && !isOpen) toggleCase(); updateEjectButton(); invalidate(); }
    function updateEjectButton() { const b = document.getElementById('ejectDiscBtn'); if (b) b.textContent = isDiscOut ? 'Masukkan CD' : 'Keluarkan CD'; }

    function toggleSpin() {

    function setupUIEvents() {

    // inFrame: invalidate() yang dipanggil DI DALAM animate() tidak boleh menjadwalkan rAF baru,

        for (const mat of activeGhostMaterials) mat.emissiveIntensity = ghostIntensity;
      }

      // 2. State Machine Gerakan Fisik 2-Fase (Return-then-Retrieve 14 Slot)
      let targetAsmX = 0, targetAsmY = 0, targetAsmZ = 0;
      let targetEulerX = targetRotX, targetEulerY = targetRotY;

      if (rackSwapState === 'RETURN_CLOSE') {
        targetLidAngle = 0.0;
        targetAsmX = 0.0; targetAsmY = 0.0; targetAsmZ = 0.0;
        targetEulerX = 0.02; targetEulerY = 0.42;

        if (Math.abs(currentLidAngle) < 0.04) {

      } else if (rackSwapState === 'RETURN_FLY') {

        if (rackSlotMarkers[_returnSlotIndex]) {

        }

      } else if (rackSwapState === 'RACK_WAIT') {
        // Kaset tetap di slot rak sambil menunggu image selesai di-load.
        // Begitu pendingAlbumDataReady === true barulah diangkat.
        targetLidAngle = 0.0;
        if (rackSlotMarkers[_targetSlotIndex]) {
          rackSlotMarkers[_targetSlotIndex].getWorldPosition(_tempSlotPos);
        }
        targetAsmX = _tempSlotPos.x; targetAsmY = _tempSlotPos.y; targetAsmZ = _tempSlotPos.z;
        targetEulerX = 0.12; targetEulerY = 0.45;
        targetAssemblyScale = RACK_SCALE;
        if (pendingAlbumDataReady) {
          resetPrep();
          rackSwapState = 'RETRIEVE_LIFT';
        }
      } else if (rackSwapState === 'RETRIEVE_LIFT') {
        // Gambar sudah siap — angkat kaset dari rak sambil mulai membesar
        targetLidAngle = 0.0;
        if (rackSlotMarkers[_targetSlotIndex]) {
          rackSlotMarkers[_targetSlotIndex].getWorldPosition(_tempSlotPos);
          _tempHoverPos.copy(_tempSlotPos).add(new THREE.Vector3(0, 1.25, 0.28));
        }
        targetAsmX = _tempHoverPos.x; targetAsmY = _tempHoverPos.y; targetAsmZ = _tempHoverPos.z;
        targetEulerX = 0.12; targetEulerY = 0.45;
        // Mulai membesar saat terangkat keluar dari rak
        targetAssemblyScale = STAGE_SCALE;
        prepStepFrame(); // 1 texture per frame selama animasi angkat
        const d = Math.hypot(currentAssemblyX - _tempHoverPos.x, currentAssemblyY - _tempHoverPos.y, currentAssemblyZ - _tempHoverPos.z);
        if (d < 0.22) {
          rackSwapState = 'FLY_STAGE';
        }
      } else if (rackSwapState === 'FLY_STAGE') {
        targetLidAngle = 0.0;
        targetAsmX = 0.0; targetAsmY = 0.0; targetAsmZ = 0.0;
        targetEulerX = showcaseRotX; targetEulerY = showcaseRotY;
        targetAssemblyScale = STAGE_SCALE;
        prepStepFrame();
        const d = Math.hypot(currentAssemblyX, currentAssemblyY, currentAssemblyZ);
        if (d < 0.2 && prepIsReady()) {
          // Gambar dijamin sudah siap (RACK_WAIT memastikannya)
          updateTextures();
          isOpen = true;
          document.getElementById('caseStateText').innerText = "Tutup Casing";
          rackSwapState = 'IDLE';
        }
      } else {
        const holdOpen = isOpen || discOutAmt > 0.12;
        targetLidAngle = holdOpen ? LID_OPEN_ANGLE : 0.0;
        targetAsmX = holdOpen ? OPEN_OFFSET_X : 0.0;
        targetAsmY = 0.0; targetAsmZ = 0.0;
        targetEulerX = targetRotX; targetEulerY = targetRotY;
      }

      currentAssemblyX = approach(currentAssemblyX, targetAsmX, 0.08);
      currentAssemblyY = approach(currentAssemblyY, targetAsmY, 0.08);
      currentAssemblyZ = approach(currentAssemblyZ, targetAsmZ, 0.08);
      currentRotX = approach(currentRotX, targetEulerX, 0.08);
      currentRotY = approach(currentRotY, targetEulerY, 0.08);
      // Interpolasi skala: kecil saat di rak, normal saat di panggung
      currentAssemblyScale = approach(currentAssemblyScale, targetAssemblyScale, 0.10);

      currentLidAngle = approach(currentLidAngle, targetLidAngle, 0.1);
      const openProgress = currentLidAngle / LID_OPEN_ANGLE;
      const discTarget = (isDiscOut && isOpen && openProgress > 0.85) ? 1 : 0;
      discOutAmt = approach(discOutAmt, discTarget, 0.07, 0.0015);
      const spinTarget = isDiscSpinning ? 1 : 0;
      bobAmp = approach(bobAmp, spinTarget, 0.06, 0.002);
      const bobY = Math.sin((now / 1000) * 1.6) * 0.06 * bobAmp;

      if (cdAssembly) {
        cdAssembly.rotation.x = currentRotX;
        cdAssembly.rotation.y = currentRotY;
        cdAssembly.position.x = currentAssemblyX;
        cdAssembly.position.y = currentAssemblyY + bobY;
        cdAssembly.position.z = currentAssemblyZ;
        cdAssembly.scale.setScalar(currentAssemblyScale);
      }
      if (caseLidGroup) caseLidGroup.rotation.y = currentLidAngle;
      if (cdDiscGroup) {
        const lift = smoothstep(0, 0.45, discOutAmt), rise = smoothstep(0.3, 1, discOutAmt);
        cdDiscGroup.position.set(0, 1.15 * rise, cdDiscGroup.userData.baseZ + 0.6 * lift);
        cdDiscGroup.rotation.x = -0.5 * rise;
      }
      if (cdDiscMesh && isDiscSpinning) cdDiscMesh.rotation.z += 0.022 * f;
      updateShadow(bobY);
      renderer.render(scene, camera);

      const swapAnimating = rackSwapState !== 'IDLE';
      const scaleDone = Math.abs(currentAssemblyScale - targetAssemblyScale) < 0.002;
      const animating = swapAnimating || isDiscSpinning || currentRotX !== targetEulerX || currentRotY !== targetEulerY || currentLidAngle !== targetLidAngle || discOutAmt !== discTarget || bobAmp !== spinTarget || !scaleDone || (cdAssembly && (Math.abs(cdAssembly.position.x - targetAsmX) > 0.002 || Math.abs(cdAssembly.position.y - (targetAsmY + bobY)) > 0.002 || Math.abs(cdAssembly.position.z - targetAsmZ) > 0.002)) || activeGhostMaterials.length > 0;
      inFrame = false;
      if (animating || redrawRequested) rafId = requestAnimationFrame(animate); else lastFrameTime = 0;
    }

    window.onload = async function () {
      try { await Promise.race([Promise.all([document.fonts.load("bold 72px 'Space Mono'"), document.fonts.load("24px 'Space Mono'"), document.fonts.load("600 32px 'Plus Jakarta Sans'")]), new Promise(r => setTimeout(r, 2500))]); } catch (_) { }
      init(); invalidate();
    };
  </script>
</body>
